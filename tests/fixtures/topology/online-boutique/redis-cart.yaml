apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
  namespace: boutique
  labels:
    app: redis-cart
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: redis-cart
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cart
  namespace: boutique
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
