# Aegis — Grafana Datasource Provisioning
# Pre-provisions Prometheus, Loki, and Tempo as data sources.
# Grafana reads this file on startup from /etc/grafana/provisioning/datasources/
# URLs are env-var driven (defaults to local Docker Compose stack service names).
# In production, set PROMETHEUS_URL, LOKI_URL, TEMPO_URL in deploy/.env to point to external cluster.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL:-http://prometheus:9090}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  - name: Loki
    type: loki
    access: proxy
    url: ${LOKI_URL:-http://loki:3100}
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "(?:traceID|trace_id)=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: ${TEMPO_URL:-http://tempo:3200}
    editable: false
    jsonData:
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
