agents:
  infrastructure_investigator:
    primary:
      provider: gemini
      model: gemini-3.5-flash-lite
      token_limit: 0
      temperature: 0.2
      top_p: null
      api_key: null
      base_url: null
    fallback:
    - provider: gemini
      model: gemini-3.1-flash-lite
      token_limit: 0
      temperature: 0.2
      top_p: null
      api_key: null
      base_url: null
    - provider: gemini
      model: gemma-4-31b-it
      token_limit: 8000
      temperature: 0.2
      top_p: null
      api_key: null
      base_url: null
    timeout_ms: 30000
    retry_on:
    - rate_limit
    - timeout
    - provider_error
    token_budget: null
    max_iter: null
    max_tool_calls: null
    tool_selector:
      match_any:
        - k8s
        - metrics
      exclude:
        - write


