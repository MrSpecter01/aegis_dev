# Default values for onlineboutique.
images:
  repository: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo
  tag: "v0.10.7"
  pullPolicy: IfNotPresent

serviceAccounts:
  create: true
  annotations: {}

networkPolicies:
  create: false

sidecars:
  create: false

frontend:
  create: true
  name: frontend
  replicaCount: 1

cartservice:
  create: true
  name: cartservice
  replicaCount: 1

productcatalogservice:
  create: true
  name: productcatalogservice
  replicaCount: 1

currencyservice:
  create: true
  name: currencyservice
  replicaCount: 1

paymentservice:
  create: true
  name: paymentservice
  replicaCount: 1

shippingservice:
  create: true
  name: shippingservice
  replicaCount: 1

emailservice:
  create: true
  name: emailservice
  replicaCount: 1

checkoutservice:
  create: true
  name: checkoutservice
  replicaCount: 1

recommendationservice:
  create: true
  name: recommendationservice
  replicaCount: 1

adservice:
  create: true
  name: adservice
  replicaCount: 1

redis:
  create: true
  name: redis-cart
